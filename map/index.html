        function initKoreanMap() {
            map = L.map('map', {
                center: BUSAN_CENTER,

                zoomControl: false
            });

            L.control.zoom({ position: 'topright' }).addTo(map);

            // Google Maps Korean Vector Tile Layer (Guaranteed NO 403, crisp Korean place names)
            const googleKoreanTile = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}&hl=ko', {
                subdomains: ['0', '1', '2', '3'],
                maxZoom: 20,
                attribution: '&copy; Google Maps'
            });

            const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            });

            googleKoreanTile.addTo(map);

            const baseMaps = {
                "한국어 지도 (Google)": googleKoreanTile,
                "일반 지도 (OSM)": osmTile
            };
            L.control.layers(baseMaps, null, { position: 'bottomright' }).addTo(map);

            markersGroup = L.markerClusterGroup({
                spiderfyOnMaxZoom: true,
                showCoverageOnHover: false,
                zoomToBoundsOnClick: true,
                maxClusterRadius: 40,

                iconCreateFunction: function(cluster) {
                    const count = cluster.getChildCount();
                    return L.divIcon({
                        html: `<div>${count}</div>`,
                        className: 'custom-cluster-icon',
                        iconSize: L.point(34, 34)
                    });

        // Automatic category identification logic based on CSV fields & store names
        function detectCategory(row) {
            const rawName = (row['상호명'] || '').trim();
            const subCat = (row['상권업종소분류명'] || '').trim();
            const midCat = (row['상권업종중분류명'] || '').trim();

            if (subCat.includes('백화점') || rawName.includes('백화점')) {
                return '백화점';
            }

            if (subCat.includes('대형마트') || 
                (rawName.includes('이마트') && !rawName.includes('이마트24')) || 
                rawName.includes('홈플러스') || 
                rawName.includes('롯데마트') || 
                rawName.includes('코스트코') || 
                rawName.includes('메가마트') ||
                rawName.includes('트레이더스')) {
                return '대형마트';
            }

            if (subCat.includes('헬스') || midCat.includes('체육') || 
                rawName.includes('헬스') || rawName.includes('휘트니스') || 
                rawName.includes('피트니스') || rawName.includes('짐') || 
                rawName.includes('스포애니') || rawName.includes('스마트핏')) {
                return '헬스장';
            }

            if (subCat.includes('편의점') || rawName.includes('GS25') || 
                rawName.includes('CU') || rawName.includes('세븐일레븐') || 
                rawName.includes('이마트24') || rawName.includes('미니스톱')) {
                return '편의점';
            }

            return '기타';
        }

        function processCSVData(data) {
            allStores = data.map((row, index) => {
                const rawName = (row['상호명'] || '시설').trim();
                const branch = row['지점명'] ? `(${row['지점명'].trim()})` : '';
                const fullTitle = `${rawName} ${branch}`.trim();
                const category = detectCategory(row);

                const address = row['도로명주소'] || row['지번주소'] || '주소 정보 없음';
                const district = row['시군구명'] || '기타';
                const lng = parseFloat(row['경도'] || row['lon'] || row['x']);
                const lat = parseFloat(row['위도'] || row['lat'] || row['y']);

                return {
                    id: index,
                    name: fullTitle,
                    category: category,
                    address: address,
                    district: district,
                    lat: lat,
                    lng: lng
                };
            }).filter(s => !isNaN(s.lat) && !isNaN(s.lng));

            populateDistrictOptions();
            filterAndRenderStores();
        }

        function populateDistrictOptions() {
            const districtSelect = document.getElementById('district-filter');
            districtSelect.innerHTML = '<option value="">부산광역시 전체 (구/군 선택)</option>';

            const districts = [...new Set(allStores.map(s => s.district))].filter(Boolean).sort();
            districts.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d;
                opt.textContent = d;
                districtSelect.appendChild(opt);
            });
        }

        function filterAndRenderStores() {
            const searchKeyword = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedDistrict = document.getElementById('district-filter').value;

            const filtered = allStores.filter(store => {
                const matchesSearch = store.name.toLowerCase().includes(searchKeyword) ||
                                      store.address.toLowerCase().includes(searchKeyword);
                const matchesDistrict = selectedDistrict === "" || store.district === selectedDistrict;
                const matchesCategory = activeCategoryFilter === 'ALL' || store.category === activeCategoryFilter;

                return matchesSearch && matchesDistrict && matchesCategory;
            });

            renderStoresOnMapAndSidebar(filtered);
        }

        function renderStoresOnMapAndSidebar(stores) {
            markersGroup.clearLayers();
            const storeListEl = document.getElementById('store-list');
            storeListEl.innerHTML = '';

            document.getElementById('total-count').textContent = stores.length.toLocaleString();

            if (stores.length === 0) {
                storeListEl.innerHTML = `
                    <div class="p-8 text-center text-slate-400">
                        <i class="fa-solid fa-location-crosshairs text-3xl mb-2 text-slate-300"></i>
                        <p class="text-sm font-medium">검색 결과가 없습니다.</p>
                        <p class="text-xs text-slate-400 mt-1">검색어나 카테고리 조건 변경을 시도해보세요.</p>
                    </div>`;
                return;
            }

            const bounds = [];

            stores.forEach(store => {
                const pos = [store.lat, store.lng];
                bounds.push(pos);

                const catStyle = CATEGORY_STYLES[store.category] || CATEGORY_STYLES['기타'];
                
                // Custom SVG Marker Pin Icon per Category
                const customIcon = L.divIcon({
                    className: 'custom-map-pin',
                    html: `
                        <div style="background-color:${catStyle.bg}; color:${catStyle.text}; width:30px; height:30px; border-radius:50%; border:2px solid white; box-shadow:0 3px 8px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center; font-size:12px;">
                            <i class="fa-solid ${catStyle.icon}"></i>
                        </div>`,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15],
                    popupAnchor: [0, -15]
                });

                const marker = L.marker(pos, { icon: customIcon });

                // Popup card with Kakao Maps & Naver Maps Navigation Link
                const popupHTML = `
                    <div class="p-2 min-w-[220px]">
                        <div class="flex items-center justify-between mb-1.5 gap-2">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${catStyle.badge}">
                                <i class="fa-solid ${catStyle.icon} mr-1"></i>${escapeHtml(store.category)}
                            </span>
                            <span class="text-[11px] text-slate-500 font-medium">${escapeHtml(store.district)}</span>
                        </div>
                        <h3 class="font-bold text-slate-900 text-sm mb-1">${escapeHtml(store.name)}</h3>
                        <p class="text-xs text-slate-600 leading-tight mb-2.5">${escapeHtml(store.address)}</p>
                        
                        <div class="pt-2.5 border-t border-slate-100 flex items-center justify-center gap-2">
                            <a href="https://map.kakao.com/?q=${encodeURIComponent(store.name + ' ' + store.address)}" target="_blank" class="px-3 py-1.5 text-[11px] bg-amber-300 hover:bg-amber-400 text-amber-950 font-bold rounded-lg transition flex items-center justify-center gap-1 shadow-sm">
                                <i class="fa-solid fa-map-pin text-[10px]"></i> 카카오맵
                            </a>
                            <a href="https://map.naver.com/v5/search/${encodeURIComponent(store.name + ' ' + store.address)}" target="_blank" class="btn-naver px-3 py-1.5 text-[11px] bg-emerald-600 hover:bg-emerald-700 font-bold rounded-lg transition flex items-center justify-center gap-1 shadow-sm" style="color: #ffffff !important;">
                                <i class="fa-solid fa-arrow-up-right-from-square text-[9px]" style="color: #ffffff !important;"></i> 네이버지도앱
                            </a>
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHTML);
                markersGroup.addLayer(marker);

                // Create Sidebar Card Item
                const itemEl = document.createElement('div');
                itemEl.className = 'p-3 hover:bg-slate-50 rounded-xl cursor-pointer transition border border-transparent hover:border-slate-200 group';
                itemEl.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <h4 class="font-semibold text-slate-900 text-sm group-hover:text-indigo-600 transition flex items-center gap-1.5">
                            <i class="fa-solid ${catStyle.icon} text-xs text-slate-400 group-hover:text-indigo-600"></i>
                            ${escapeHtml(store.name)}
                        </h4>
                        <span class="text-[10px] px-2 py-0.5 rounded-md font-medium border ${catStyle.badge} shrink-0 ml-2">
                            ${escapeHtml(store.category)}
                        </span>
                    </div>
                    <p class="text-xs text-slate-500 line-clamp-1 mb-2"><i class="fa-solid fa-location-dot text-slate-400 mr-1 text-[10px]"></i>${escapeHtml(store.address)}</p>
                    <div class="flex gap-1.5 pt-1">
                        <a href="https://map.kakao.com/?q=${encodeURIComponent(store.name + ' ' + store.address)}" target="_blank" onclick="event.stopPropagation()" class="text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-900 font-semibold px-2 py-0.5 rounded transition inline-flex items-center gap-1">
                            <i class="fa-solid fa-map-pin text-[9px]"></i> 카카오맵
                        </a>
                        <a href="https://map.naver.com/v5/search/${encodeURIComponent(store.name + ' ' + store.address)}" target="_blank" onclick="event.stopPropagation()" class="btn-naver text-[10px] bg-emerald-600 hover:bg-emerald-700 font-semibold px-2 py-0.5 rounded transition inline-flex items-center gap-1" style="color: #ffffff !important;">
                            <i class="fa-solid fa-arrow-up-right-from-square text-[9px]" style="color: #ffffff !important;"></i> 네이버지도앱
                        </a>
                    </div>
                `;

                itemEl.addEventListener('click', () => {
                    if (markersGroup.hasLayer(marker)) {
                        markersGroup.zoomToShowLayer(marker, () => {
                            marker.openPopup();
                        });
                    } else {
                        map.setView(pos, 16);
                        marker.openPopup();
                    }

                    if (window.innerWidth < 768) {
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                    }
                });

                storeListEl.appendChild(itemEl);
            });

            if (bounds.length > 0 && bounds.length < 500) {
                map.fitBounds(bounds, { padding: [50, 50], maxZoom: 16 });
            }
        }

        function setupEventListeners() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');
            const districtFilter = document.getElementById('district-filter');
            const categoryButtons = document.querySelectorAll('.cat-btn');
            const toggleSidebarBtn = document.getElementById('toggle-sidebar');
            const sidebar = document.getElementById('sidebar');
            const csvInput = document.getElementById('csv-file-input');

            // Search input listener
            searchInput.addEventListener('input', (e) => {
                if (e.target.value.trim().length > 0) {
                    clearBtn.classList.remove('hidden');
                } else {
                    clearBtn.classList.add('hidden');
                }
                filterAndRenderStores();
            });

            // Clear search button
            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                filterAndRenderStores();
            });

            // District dropdown change listener
            districtFilter.addEventListener('change', filterAndRenderStores);

            // Category filter tabs handler
            categoryButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    categoryButtons.forEach(b => {
                        b.classList.remove('active', 'bg-indigo-600', 'text-white', 'shadow-sm');
                        b.classList.add('text-slate-600');
                    });
                    btn.classList.add('active', 'bg-indigo-600', 'text-white', 'shadow-sm');
                    btn.classList.remove('text-slate-600');

                    activeCategoryFilter = btn.dataset.category;
                    filterAndRenderStores();
                });
            });

            // Mobile menu toggle
            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
            });

            // CSV File Parsing
            csvInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    Papa.parse(file, {
                        header: true,
                        skipEmptyLines: true,
                        complete: function(results) {
                            processCSVData(results.data);
                        },
                        error: function(err) {
                            alert('CSV 처리 오류: ' + err.message);
                        }
                    });
                }
            });
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
